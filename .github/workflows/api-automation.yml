name: Run Spotify API Automation Test

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      classname:
        description: 'Class to run (e.g. PlaylistTests)'
        required: false
      testname:
        description: 'Test to run (e.g. getPlaylistInformationTest)'
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Clean Maven
        run: mvn clean

      - name: Install Dependencies
        run: mvn install -DskipTests -U

      - name: Run Tests
        run: |
          if [[ -n "${{ github.event.inputs.classname }}" && -n "${{ github.event.inputs.testname }}" ]]; then
            mvn test -DtestFailureIgnore -Dtest=${{ github.event.inputs.classname }}#${{ github.event.inputs.testname }}
          elif [[ -n "${{ github.event.inputs.classname }}" ]]; then
            mvn test -DtestFailureIgnore -Dtest=${{ github.event.inputs.classname }}
          else
            mvn test -DtestFailureIgnore
          fi

      - name: Generate Allure Report
        run: mvn allure:report

      - name: Setup Github Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Build Summary
        run: |
          if [[ -n "${{ github.event.inputs.classname }}" ]]; then
            TEST_RESULTS="$(tail -n 1 target/surefire-reports/tests.${{ github.event.inputs.classname }}.txt)"
          else
            TEST_RESULTS="$(tail -n 1 target/surefire-reports/TestSuite.txt)"
          fi
          echo "Test Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "$TEST_RESULTS" | awk '{ 
            split($0, arr, ", ");
            for (i in arr) {
              split(arr[i], kv, ": ");
              key = kv[1];
              value = kv[2];
              gsub(/^[ \t]+|[ \t]+$/, "", key);
              gsub(/^[ \t]+|[ \t]+$/, "", value);
              if (key == "Tests run") tests_run = value;
              if (key == "Failures") failures = value;
              if (key == "Errors") errors = value;
              if (key == "Skipped") skipped = value;
              passed = tests_run - failures
            }
            printf "| Total | Pass | Fail | Skip |\n"
            printf "|:-----:|:----:|:----:|:----:|\n"
            printf "| %-7s | %-7s | %-7s | %-7s |\n", tests_run, passed, failures, skipped;
          }' >> $GITHUB_STEP_SUMMARY
          echo "-----" >> $GITHUB_STEP_SUMMARY
          echo "See full report: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY

      - name: Delete Artifact
        uses: GeekyEggo/delete-artifact@v5.0.0
        with:
          name: github-pages

